<!doctype html>
<!-- Generated by wrapper.sh --init. Re-run it after adding a new app. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffb703">
  <title>Kids Corner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 2rem 1.25rem 3rem;
      font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", system-ui, sans-serif;
      color: #023047; text-align: center;
      background:
        radial-gradient(circle at 10% 15%, #ffd6e0 0 4rem, transparent 4.1rem),
        radial-gradient(circle at 90% 10%, #caf0f8 0 5rem, transparent 5.1rem),
        radial-gradient(circle at 85% 90%, #d8f3dc 0 6rem, transparent 6.1rem),
        radial-gradient(circle at 5% 85%, #e0c3fc 0 4.5rem, transparent 4.6rem),
        #fff3c4;
      background-attachment: fixed;
    }
    header { margin-bottom: 2rem; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 4rem); letter-spacing: 0.03em; }
    h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
    h1 span:nth-child(5n+1) { color: #e63946; }
    h1 span:nth-child(5n+2) { color: #fb8500; animation-delay: 0.2s; }
    h1 span:nth-child(5n+3) { color: #2a9d8f; animation-delay: 0.4s; }
    h1 span:nth-child(5n+4) { color: #3a86ff; animation-delay: 0.6s; }
    h1 span:nth-child(5n+5) { color: #8338ec; animation-delay: 0.8s; }
    .tagline { margin: 0.5rem 0 0; font-size: 1.3rem; }
    ul {
      list-style: none; margin: 0 auto; padding: 0; max-width: 60rem;
      display: grid; gap: 1.75rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    }
    .card {
      --accent: #ffb703;
      display: flex; flex-direction: column; align-items: center; gap: 0.6rem; height: 100%;
      padding: 1.75rem 1.25rem 1.5rem; border-radius: 2rem; border: 5px solid var(--accent);
      background: #fff; color: inherit; text-decoration: none;
      box-shadow: 0 10px 0 var(--accent);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover, .card:focus-visible { transform: translateY(-4px) rotate(-1deg); box-shadow: 0 14px 0 var(--accent); outline: none; }
    .card:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--accent); }
    .card img { width: 7rem; height: 7rem; border-radius: 1.5rem; }
    .name { font-size: 1.8rem; font-weight: bold; }
    .desc { font-size: 1.05rem; line-height: 1.4; opacity: 0.8; }
    .play {
      margin-top: auto; padding: 0.6rem 1.75rem; border-radius: 999px;
      background: var(--accent); color: #fff; font-size: 1.3rem; font-weight: bold;
    }
    @keyframes bob { 50% { transform: translateY(-0.4rem); } }
    @media (prefers-reduced-motion: reduce) {
      h1 span { animation: none; }
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1 aria-label="Kids Corner"><span>K</span><span>i</span><span>d</span><span>s</span> <span>C</span><span>o</span><span>r</span><span>n</span><span>e</span><span>r</span></h1>
    <p class="tagline">Pick a game and have fun!</p>
  </header>
  <ul>
    <li>
      <a class="card" href="k-color/src/" style="--accent: #ffb703">
        <img src="k-color/src/icon.svg" alt="">
        <span class="name">Color Fun!</span>
        <span class="desc">A kid-friendly coloring app. Pick a picture and tap to color.</span>
        <span class="play">Play</span>
      </a>
    </li>
    <li>
      <a class="card" href="k-piano/src/" style="--accent: #7b2cbf">
        <img src="k-piano/src/icon.svg" alt="">
        <span class="name">Piano Fun!</span>
        <span class="desc">A kid-friendly piano. Tap colorful keys, pick instruments, and learn simple songs.</span>
        <span class="play">Play</span>
      </a>
    </li>
  </ul>
</body>
</html>
