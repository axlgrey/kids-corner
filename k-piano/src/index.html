<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7b2cbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piano Fun">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Piano Fun!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <h1 class="title">🎹 Piano Fun!</h1>
    <div class="tools">
      <button id="labelBtn" class="tool" aria-label="Note names">🔤</button>
      <button class="tool fullscreen-btn" aria-label="Fullscreen">⛶</button>
    </div>
  </header>

  <nav id="instruments" class="chips" aria-label="Instruments"></nav>

  <div class="song-bar">
    <select id="songSelect" class="song-select" aria-label="Song"></select>
    <button id="listenBtn" class="tool" aria-label="Listen" hidden>👂</button>
    <button id="restartBtn" class="tool" aria-label="Start again" hidden>🔁</button>
    <span id="songHint" class="song-hint"></span>
  </div>

  <main class="stage">
    <div id="keyboard" class="keyboard"></div>
  </main>

  <div id="celebrate" class="celebrate" hidden>
    <div class="celebrate-box">
      <div class="stars">⭐⭐⭐</div>
      <p>Great job!</p>
      <button id="againBtn" class="big-btn">Play again</button>
      <button id="freeBtn" class="big-btn alt">Free play</button>
    </div>
  </div>

  <div id="updateBanner" class="update-banner" role="status" hidden>
    <span>✨ A new version is ready!</span>
    <button id="updateBtn" class="update-btn">Refresh</button>
    <button id="updateLater" class="update-close" aria-label="Later">✕</button>
  </div>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
