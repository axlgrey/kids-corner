<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a6fdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Train Town">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Train Town!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <canvas id="view" class="view"></canvas>
    <div id="fx" class="fx"></div>

    <header class="hud top">
      <button id="camBtn" class="tool" aria-label="Camera">🎥</button>
      <button id="nightBtn" class="tool" aria-label="Day or night">🌙</button>
      <button id="soundBtn" class="tool" aria-label="Sound">🔊</button>
      <button id="fsBtn" class="tool" aria-label="Fullscreen">⛶</button>
    </header>

    <footer class="hud bottom">
      <div class="drive">
        <button id="slowerBtn" class="tool big" aria-label="Slower">⬇️</button>
        <span id="speedLabel" class="speed">⏹️</span>
        <button id="fasterBtn" class="tool big" aria-label="Faster">⬆️</button>
        <button id="stopBtn" class="tool big" aria-label="Stop">✋</button>
      </div>
      <div class="drive">
        <button id="dropBtn" class="tool big" aria-label="Drop something on the track">📦</button>
        <button id="hornBtn" class="tool big horn" aria-label="Whistle">📣</button>
      </div>
    </footer>

    <div id="start" class="overlay">
      <div class="box">
        <div class="logo">🚂🚃🚃</div>
        <h1>Train Town!</h1>
        <p>Tap anything! Drive the train, toot the whistle, bump into things.</p>
        <button id="goBtn" class="go">All aboard!</button>
      </div>
    </div>
  </main>

  <div id="updateBanner" class="update-banner" role="status" hidden>
    <span>✨ A new version is ready!</span>
    <button id="updateBtn" class="update-btn">Refresh</button>
    <button id="updateLater" class="update-close" aria-label="Later">✕</button>
  </div>

  <script src="sound.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
