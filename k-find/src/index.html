<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff8fab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Find It">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Find It!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <canvas id="view" class="view"></canvas>
    <div id="fx" class="fx"></div>
    <div id="arrow" class="arrow" hidden>👉</div>

    <header id="hud" class="hud" hidden>
      <button id="pauseBtn" class="tool" aria-label="Pause">⏸️</button>
      <div id="target" class="target">
        <span id="targetEmoji" class="target-emoji">🧸</span>
        <span class="target-text">Find the <b id="targetName">teddy bear</b>!</span>
      </div>
      <span id="countText" class="pill">0/5</span>
      <button id="hintBtn" class="tool" aria-label="Hint">💡</button>
      <button id="gyroBtn" class="tool" aria-label="Look with phone">📱</button>
    </header>

    <section id="menu" class="overlay">
      <div class="panel">
        <h1 class="title">🔍 Find It!</h1>
        <p class="sub">Look around the room and find the toys and treats!</p>
        <div class="tools-row">
          <button id="soundBtn" class="tool" aria-label="Sound">🔊</button>
          <button id="voiceBtn" class="tool" aria-label="Voice">🗣️</button>
          <button class="tool fullscreen-btn" aria-label="Fullscreen">⛶</button>
        </div>
        <div class="modes">
          <button class="mode-btn easy" data-diff="easy">🐣 Easy<small data-best="easy"></small></button>
          <button class="mode-btn normal" data-diff="normal">🐶 Normal<small data-best="normal"></small></button>
          <button class="mode-btn hard" data-diff="hard">🦁 Hard<small data-best="hard"></small></button>
        </div>
        <p class="hint">📱 Move your phone or drag to look around. Tap to find!</p>
      </div>
    </section>

    <section id="pause" class="overlay" hidden>
      <div class="panel">
        <h1 class="title">⏸️ Paused</h1>
        <button id="resumeBtn" class="big-btn">▶️ Keep looking</button>
        <button id="quitBtn" class="big-btn alt">🏠 Menu</button>
      </div>
    </section>

    <section id="over" class="overlay" hidden>
      <div class="panel">
        <h1 class="title">🎉 You found them all!</h1>
        <div id="overStars" class="stars">⭐⭐⭐</div>
        <div id="overItems" class="found-items"></div>
        <p id="overTime" class="final">⏱️ 0:00</p>
        <p id="overBest" class="best"></p>
        <button id="againBtn" class="big-btn">🔁 Play again</button>
        <button id="homeBtn" class="big-btn alt">🏠 Menu</button>
      </div>
    </section>
  </main>

  <div id="updateBanner" class="update-banner" role="status" hidden>
    <span>✨ A new version is ready!</span>
    <button id="updateBtn" class="update-btn">Refresh</button>
    <button id="updateLater" class="update-close" aria-label="Later">✕</button>
  </div>

  <script src="sound.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
