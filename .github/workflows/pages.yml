# Generated by wrapper.sh --init. Every directory containing a
# manifest.webmanifest is published as its own app. For <app>/src/ the app is
# served at /<repo>/<app>/, otherwise at /<repo>/<dir>/.
name: Deploy PWAs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect PWAs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          touch _site/.nojekyll
          links=""
          while IFS= read -r manifest; do
            dir="$(dirname "$manifest")"
            dir="${dir#./}"
            if [ "$(basename "$dir")" = "src" ]; then
              app="$(basename "$(dirname "$dir")")"
            else
              app="$(basename "$dir")"
            fi
            if [ "$dir" = "." ] || [ "$app" = "." ]; then
              echo "skipping manifest at repo root"
              continue
            fi
            if [ -e "_site/$app" ]; then
              echo "error: duplicate app name '$app' ($dir)" >&2
              exit 1
            fi
            title="$(sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -n 1)"
            [ -n "$title" ] || title="$app"
            echo "publishing $dir -> /$app/"
            cp -R "$dir" "_site/$app"
            links="$links<li><a href=\"$app/\">$title</a></li>"
          done < <(find . -name manifest.webmanifest -not -path './.git/*' -not -path '*/node_modules/*' -not -path './_site/*' | sort)
          if [ -z "$links" ]; then
            echo "error: no manifest.webmanifest found" >&2
            exit 1
          fi
          cat > _site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps</title></head>
          <body style="font-family:sans-serif;font-size:1.5rem;padding:2rem">
          <h1>Apps</h1>
          <ul>$links</ul>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
