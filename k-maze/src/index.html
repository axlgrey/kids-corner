<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffbe0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maze Mouse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Maze Mouse!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <canvas id="view2d" class="view"></canvas>
    <canvas id="view3d" class="view" hidden></canvas>
    <div id="touch" class="touch"></div>
    <div id="stick" class="stick" hidden><div id="knob" class="knob"></div></div>
    <div id="fx" class="fx"></div>

    <header id="hud" class="hud" hidden>
      <button id="pauseBtn" class="tool" aria-label="Pause">⏸️</button>
      <span id="starText" class="pill">⭐ 0/0</span>
      <span id="keyText" class="pill" hidden>🔒</span>
      <span id="timeText" class="pill">⏱️ 0:00</span>
      <span class="spacer"></span>
      <button id="hintBtn" class="tool" aria-label="Show the way">💡</button>
      <button id="viewBtn" class="tool" aria-label="Switch view">🎥</button>
      <button id="hudSoundBtn" class="tool" aria-label="Sound">🔊</button>
    </header>

    <section id="menu" class="overlay">
      <div class="panel">
        <h1 class="title">🐭 Maze Mouse!</h1>
        <p class="sub">Help the mouse find the 🧀 cheese! Grab ⭐ stars on the way.</p>
        <div class="tools-row">
          <button id="soundBtn" class="tool" aria-label="Sound">🔊</button>
          <button class="tool fullscreen-btn" aria-label="Fullscreen">⛶</button>
        </div>
        <h2>View</h2>
        <div class="views">
          <button class="view-btn" data-view="2d">🗺️ From above</button>
          <button class="view-btn" data-view="3d">🎥 Mouse eyes</button>
        </div>
        <div class="modes">
          <button class="mode-btn easy" data-diff="easy">🐣 Easy<small data-best="easy">Lights on!</small></button>
          <button class="mode-btn normal" data-diff="medium">🔦 Medium<small data-best="medium">Flashlight</small></button>
          <button class="mode-btn hard" data-diff="hard">👻 Hard<small data-best="hard">Spooky!</small></button>
        </div>
        <p class="hint">Drag anywhere (or arrow keys) to walk. Tap to squeak!</p>
      </div>
    </section>

    <section id="pause" class="overlay" hidden>
      <div class="panel">
        <h1 class="title">⏸️ Paused</h1>
        <button id="resumeBtn" class="big-btn">▶️ Keep going</button>
        <button id="quitBtn" class="big-btn alt">🏠 Menu</button>
      </div>
    </section>

    <section id="over" class="overlay" hidden>
      <div class="panel">
        <h1 class="title">🧀 Yum yum!</h1>
        <div id="overStars" class="stars">⭐⭐⭐</div>
        <p id="overCount" class="sub"></p>
        <p id="overTime" class="final">⏱️ 0:00</p>
        <p id="overBest" class="best"></p>
        <button id="againBtn" class="big-btn">🔁 New maze</button>
        <button id="homeBtn" class="big-btn alt">🏠 Menu</button>
      </div>
    </section>
  </main>

  <div id="updateBanner" class="update-banner" role="status" hidden>
    <span>✨ A new version is ready!</span>
    <button id="updateBtn" class="update-btn">Refresh</button>
    <button id="updateLater" class="update-close" aria-label="Later">✕</button>
  </div>

  <script src="sound.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
